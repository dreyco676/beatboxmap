# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxkit"
version = "0.0.0"
description = "Vocal-percussion to MIDI: offline analysis pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "VoxKit contributors" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

# Runtime deps. Platform-specific audio backends are extras.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "librosa>=0.10",
    "mido>=1.3",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
audio-windows = ["sounddevice>=0.4.6"]
audio-linux = ["sounddevice>=0.4.6"]
ui = ["PySide6>=6.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "psutil>=5.9",
    "import-linter>=2.0",
    "reuse>=3.0",
    "pre-commit>=3.6",
]

[project.urls]
Homepage = "https://github.com/anthropics/voxkit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["voxkit*"]

# ---------------------------------------------------------------
# pytest
# ---------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "slow: long-running test; excluded from synthetic-tier CI by default",
    "dataset_required(name): requires the named dataset; skipped if not present",
]
# Filter the warnings that v0.12 T35 (test_09) and elsewhere INTENTIONALLY
# emit. Keep deprecation warnings as errors so the team notices real ones.
filterwarnings = [
    "error::DeprecationWarning",
    "default::UserWarning",
]

# ---------------------------------------------------------------
# coverage
# ---------------------------------------------------------------
[tool.coverage.run]
source = ["src/voxkit"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 0   # release-gate coverage thresholds per TDD_README §coverage
                # are enforced in a follow-up CI job once components are green.
